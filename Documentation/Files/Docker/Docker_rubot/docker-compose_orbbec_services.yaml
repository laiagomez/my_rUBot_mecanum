name: robot_humble_stack

services:
  my_robot:
    image: manelpuig/ros2-humble-ub-rubot:orbbec
    container_name: my_robot
    privileged: true
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    restart: unless-stopped

    environment:
      ROS_DOMAIN_ID: "6"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_LOCALHOST_ONLY: "0"

    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro

    command: >
      bash -lc '
      source /opt/ros/humble/setup.bash &&
      source /root/orbbec_ws/install/setup.bash &&
      source /root/ROS2_rUBot_mecanum_ws/install/setup.bash &&
      exec ros2 launch my_robot_bringup my_robot_bringup_hw.launch.py
      '

    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'source /opt/ros/humble/setup.bash && source /root/orbbec_ws/install/setup.bash && source /root/ROS2_rUBot_mecanum_ws/install/setup.bash && ros2 node list | grep -q .'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  my_rosbridge:
    image: manelpuig/ros2-humble-ub-rubot:orbbec
    container_name: my_rosbridge
    privileged: true
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    restart: unless-stopped

    depends_on:
      my_robot:
        condition: service_healthy

    environment:
      ROS_DOMAIN_ID: "6"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_LOCALHOST_ONLY: "0"

    command: >
      bash -lc '
      source /opt/ros/humble/setup.bash &&
      source /root/orbbec_ws/install/setup.bash &&
      source /root/ROS2_rUBot_mecanum_ws/install/setup.bash &&
      exec ros2 run rosbridge_server rosbridge_websocket
      --port 9090
      --address 0.0.0.0
      --ros-args
      -p default_call_service_timeout:=5.0
      -p call_services_in_new_thread:=true
      -p send_action_goals_in_new_thread:=true
      '

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',9090)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  my_robot_web:
    image: manelpuig/ros2-humble-ub-rubot:orbbec
    container_name: my_robot_web
    network_mode: host
    tty: true
    stdin_open: true
    restart: unless-stopped

    depends_on:
      my_rosbridge:
        condition: service_healthy

    working_dir: /root/ROS2_rUBot_mecanum_ws/tools/web_dashboard

    command: >
      bash -lc '
      exec python3 -m http.server 8000
      '

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
