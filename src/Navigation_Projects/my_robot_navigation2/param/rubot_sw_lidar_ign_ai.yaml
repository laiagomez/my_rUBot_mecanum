amcl:
  ros__parameters:
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: -0.5
      y: 0.0
      z: 0.0
      yaw: 0.0
    use_sim_time: True
    alpha1: 0.3   # Soroll rotacional degut a la rotació - augmenta (abans 0.2)
    alpha2: 0.3   # Soroll translacional degut a la rotació - augmenta (abans 0.2)
    alpha3: 0.3   # Soroll translacional degut a la translació - augmenta (abans 0.2)
    alpha4: 0.3   # Soroll rotacional degut a la translació - augmenta (abans 0.2)
    alpha5: 0.3   # Soroll relacionat amb errors no gaussians - augmenta (si s'utilitza) (abans 0.2)
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 3.5
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1 # Desviació estàndard del soroll del "hit" - disminueix per fer-lo més precís (abans 0.2)
    tf_broadcast: true
    transform_tolerance: 0.7
    update_min_a: 0.1  # Angle mínim per actualitzar (redueix des de 0.2) abans 0.2
    update_min_d: 0.15 # Distància mínima per actualitzar (redueix des de 0.25) abans 0.25
    z_hit: 0.9   # Probabilitat d'un "hit" (lectura a un obstacle esperat) - augmenta (abans 0.5)
    z_rand: 0.1 # Probabilitat d'una lectura aleatòria - disminueix o manté (abans 0.5)
    scan_topic: /scan

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"
    bt_loop_duration: 100 # abans 10
    default_server_timeout: 1000
    wait_for_service_timeout: 3000
    enable_groot_monitoring: False
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: false
    enable_stamped_cmd_vel: false
    feedback: "OPEN_LOOP"

    max_velocity: [0.45, 0.25, 1.6]
    min_velocity: [-0.2, -0.25, -1.6]

    max_accel: [1.8, 1.5, 3.0]
    max_decel: [-1.8, -1.5, -3.0]

    deadband_velocity: [0.005, 0.005, 0.005]

    velocity_timeout: 1.0
    odom_topic: "odom"
    odom_duration: 0.1
    cmd_vel_in: "cmd_vel_nav"
    cmd_vel_out: "cmd_vel"

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 4.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.04
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.52  # Approximately 30 degrees

    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False

      min_vel_x: -0.2
      max_vel_x: 0.45
      min_vel_y: -0.25
      max_vel_y: 0.25
      min_vel_theta: 0.0
      max_vel_theta: 1.6

      trans_stopped_velocity: 0.15
      rot_stopped_velocity: 0.10

      min_speed_xy: 0.0
      max_speed_xy: 0.50
      min_speed_theta: 0.05

      acc_lim_x: 1.8
      acc_lim_y: 1.5
      acc_lim_theta: 3.0
      decel_lim_x: -1.8
      decel_lim_y: -1.5
      decel_lim_theta: -3.0

      vx_samples: 8
      vy_samples: 6
      vtheta_samples: 12

      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.7

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - PathAlign
      - PathDist
      - GoalDist
      - GoalAlign

      # Holonomic base: prefer forward alignment on easy paths, but keep
      # path tracking and obstacle clearance as the dominant criteria.
      BaseObstacle.scale: 8.0
      PathAlign.scale: 1.0
      PathAlign.forward_point_distance: 0.10
      PathDist.scale: 20.0
      GoalDist.scale: 6.0
      GoalAlign.scale: 0.5
      GoalAlign.forward_point_distance: 0.10
      RotateToGoal.scale: 3.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      robot_radius: 0.18
      transform_tolerance: 0.7
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.25
        cost_scaling_factor: 1.0

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      robot_radius: 0.18
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.7
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        topic: /map

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.32
        cost_scaling_factor: 1.0

      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.5
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin","backup", "wait"]
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.7
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.05
    rotational_acc_lim: 1.0

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    loop_rate: 200
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
